[AUTH]
admin_password = 123

[API]
;base_url = http://127.0.0.1:8000/api/v1/
base_url =  http://192.168.0.194:443/api/v1/

[CAMERA]
width = 640
height = 480
fps = 30

[YOLO]
# YOLO ni yoqish/o'chirish (true/false)
enabled = true
# YOLO model fayli nomi (weights/ papkasida joylashgan)
model_name = yolo11n.pt
# Detect qilinadigan COCO class ID lari (vergul bilan ajratilgan)
# 0=person, 1=bicycle, 2=car, 24=backpack, 67=cell phone va h.k.
classes = 0,67,64
# Minimal confidence threshold (0.0 - 1.0)
confidence = 0.7
# Har nechta kadrda 1 marta detect qilish
frame_skip = 20

[FACE_MONITORING]
# Face Identification - yuzni tanib olish (InsightFace)
identification_interval = 10
identification_max_fail = 5
# Test paytidagi minimal o'xshashlik foizi (0-100)
monitoring_score = 38
